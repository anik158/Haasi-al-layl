name: Build Release APK

on:
  push:
    branches:
      - build-apk-release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          # The action pipes "yes" to sdkmanager, but still echoes every licence in full -
          # thousands of lines that bury whatever actually failed.
          log-accepted-android-sdk-licenses: false
          # Empty on purpose. The action otherwise runs `sdkmanager tools`, and the legacy
          # "tools" package was removed from the SDK repository years ago - cmdline-tools 16.0
          # on the current runner image fails with "Failed to find package 'tools'". The runner
          # already ships platform-tools, and AGP downloads any platform it still needs.
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee build.log

      # Kotlin prefixes errors with "e:" and they are easily lost in a long log.
      - name: Compile errors
        if: failure()
        run: |
          echo "::group::Compile errors"
          grep -E "^e: |Unresolved reference|error:|FAILURE:|What went wrong" build.log \
            | head -60 || echo "(no error lines matched - see the full log above)"
          echo "::endgroup::"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/debug/haasi-al-layl-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release APK Build ${{ github.run_number }}
          body: |
            Automated release build for Haasi al-layl

            Download the APK from the assets below.
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/haasi-al-layl-debug.apk
