name: Build Release APK

on:
  push:
    branches:
      - build-apk-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 21, not 17: Robolectric refuses to start Android SDK 35+ on anything older
      # (UnsupportedOperationException in DefaultSdkProvider), so every Robolectric test class
      # failed at setup on 17. The app itself still targets Java 11 bytecode.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Deliberately NOT android-actions/setup-android. The ubuntu runner already ships a complete
      # Android SDK with licences accepted, and the action spent two builds fighting it: first
      # failing outright on `sdkmanager tools` (a package removed from the SDK repository years
      # ago), then rejecting the preinstalled cmdline-tools as the "wrong version" and retrying an
      # aborting download for eight minutes before it finally succeeded. The same step took 37
      # seconds on earlier runs, so this is the runner image moving under the action rather than
      # anything in this project. Using the SDK that is already installed removes both failure
      # modes and the eight minutes.
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: ${SDKMANAGER:-<none found>}"
          # Licences are already accepted on the runner image; this is belt and braces and must
          # never fail the build.
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi
          echo "::group::Installed platforms"
          ls "$SDK/platforms" 2>/dev/null || echo "(none)"
          echo "::endgroup::"
          echo "::group::Installed build-tools"
          ls "$SDK/build-tools" 2>/dev/null || echo "(none)"
          echo "::endgroup::"
          # AGP resolves the compileSdk itself; this only records the starting state so a
          # "platform not found" failure is diagnosable from the log.
          echo "sdk.dir=$SDK" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee build.log

      # Kotlin prefixes errors with "e:" and they are easily lost in a long log.
      - name: Compile errors
        if: failure()
        run: |
          echo "::group::Compile errors"
          grep -E "^e: |Unresolved reference|error:|FAILURE:|What went wrong" build.log \
            | head -60 || echo "(no error lines matched - see the full log above)"
          echo "::endgroup::"

      # The Play upload: a release bundle signed with the upload key. Built only when the key is
      # in the repository secrets - never with a throwaway key, because the first bundle Play
      # receives fixes the upload key, and one generated per run would be lost at once.
      #   UPLOAD_KEYSTORE_BASE64  base64 of my-upload-key.jks (`base64 -w0 my-upload-key.jks`)
      #   UPLOAD_STORE_PASSWORD   its store password
      #   UPLOAD_KEY_PASSWORD     the "upload" key's password
      - name: Build signed release bundle (.aab)
        id: aab
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::notice::No upload key in the repository secrets - skipping the signed .aab. See docs/PLAY-STORE.md."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease --stacktrace --console=plain --no-daemon 2>&1 | tee bundle.log
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"

      # No artifacts at all - no APK, no .aab, no logs or reports: they count against the
      # repository's Actions storage, and builds to install are made locally. CI compiles, checks
      # that the signed bundle builds (when the upload key is set) and runs the tests; failures are
      # summarised in the log itself.
      - name: Unit tests
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --console=plain --no-daemon 2>&1 | tee test.log

      - name: Failed tests
        if: failure()
        run: |
          echo "::group::Failed tests"
          grep -E "FAILED|AssertionError|Exception" test.log | head -80 || echo "(no failures matched - see the log above)"
          echo "::endgroup::"
